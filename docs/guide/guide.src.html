<title>모아콘 사용 안내</title>
<style>
  /* ============================================================
     모아콘 사용 안내서
     읽는 사람이 20대부터 아버지 세대까지라, 크기와 대비를 먼저 잡았다.
     본문 18px · 캡션 15.5px · 줄길이 40자 안쪽.
     색은 앱이 쓰는 보라(#5B4FE8)를 그대로 가져와 한 식구로 만든다.
     ============================================================ */
  :root {
    --paper: #fbfafd;
    --card: #ffffff;
    --ink: #1b1726;
    --ink2: #443d57;
    --muted: #6c6580;
    --line: #e5e1ee;
    --line-soft: #f0edf6;
    --accent: #5b4fe8;
    --accent-soft: #efedfe;
    --done: #167a4b;
    --done-soft: #e4f3ea;
    --wait: #8a6a12;
    --wait-soft: #f8f0dc;

    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121016;
      --card: #1b1922;
      --ink: #edeaf5;
      --ink2: #c6c0d6;
      --muted: #948da6;
      --line: #2c2838;
      --line-soft: #221f2b;
      --accent: #8478f5;
      --accent-soft: #241f3a;
      --done: #4cc78a;
      --done-soft: #16281f;
      --wait: #d8a83a;
      --wait-soft: #2a2317;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121016; --card: #1b1922; --ink: #edeaf5; --ink2: #c6c0d6;
    --muted: #948da6; --line: #2c2838; --line-soft: #221f2b;
    --accent: #8478f5; --accent-soft: #241f3a;
    --done: #4cc78a; --done-soft: #16281f; --wait: #d8a83a; --wait-soft: #2a2317;
  }
  :root[data-theme="light"] {
    --paper: #fbfafd; --card: #ffffff; --ink: #1b1726; --ink2: #443d57;
    --muted: #6c6580; --line: #e5e1ee; --line-soft: #f0edf6;
    --accent: #5b4fe8; --accent-soft: #efedfe;
    --done: #167a4b; --done-soft: #e4f3ea; --wait: #8a6a12; --wait-soft: #f8f0dc;
  }

  * { box-sizing: border-box; }

  /* 표지의 기울어진 카드가 여백 밖으로 조금 삐져나온다. 그대로 두면 폭이 어중간한
     화면에서 가로로 몇 px 밀린다. clip은 hidden과 달리 스크롤 상자를 만들지 않아
     넘친 만큼만 잘리고 세로 스크롤은 그대로다. body에만 걸면 브라우저에 따라
     화면 전체로 옮겨 붙지 않아서, html에도 같이 건다. */
  html { overflow-x: clip; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 18px;
    line-height: 1.75;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    /* 표지의 기울어진 카드가 여백 밖으로 조금 삐져나온다. 그대로 두면 화면 폭이
       좁을 때 가로 스크롤이 생긴다. clip은 hidden과 달리 스크롤 상자를 만들지
       않아서, 넘친 만큼만 잘리고 세로 스크롤은 그대로다. */
    overflow-x: clip;
  }

  .wrap { width: min(100% - 40px, 1060px); margin-inline: auto; }
  .narrow { max-width: 42em; }

  /* ---------- 표지 ---------- */
  /* 표지만 본문(1060px)보다 넓게 쓴다. 글은 읽기 좋은 폭을 지켜야 하지만
     표지는 화면 세 장이 들어가야 해서, 같은 폭에 밀어 넣으면 글이 카드에
     씹히거나 카드가 작아진다. 둘 중 하나를 포기하는 대신 폭을 넓힌다. */
  .cover {
    padding: 72px 0 56px;
    border-bottom: 1px solid var(--line);
  }
  .cover-wrap { width: min(100% - 40px, 1320px); margin-inline: auto; }

  /* 글과 화면을 나란히 놓는다. 좁은 화면에서는 글이 먼저 오고 화면이 아래로
     내려간다 — 폰으로 여는 사람이 제목부터 읽게 된다. */
  .cover-grid {
    display: grid;
    gap: 44px 0;
    align-items: center;
  }
  @media (min-width: 860px) {
    .cover-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.22fr); gap: 0 28px; }
    /* 남는 칸을 그대로 화면 뭉치에 준다. 넓힌 폭 덕에 이제 글 위로 물리지
       않고도 화면이 크게 들어간다. */
    .cover-grid .fan { width: 100%; max-width: 760px; }
  }

  /* 화면 세 장을 부채처럼 겹친다. 앞의 목록이 이 앱의 얼굴이고, 뒤 두 장은
     한쪽이 가려진다.

     바코드가 왼쪽, 알림이 오른쪽이다. 바꿔 놓으면 둘 다 손해를 본다 —
     바코드 화면은 알맹이(상호·메모·막대 시작)가 왼쪽에 몰려 있어서 오른쪽에
     두면 그 앞부분이 가려지고, 알림은 화면 맨 위 한 줄이 전부라 어느 쪽에
     두든 앞 카드보다 위에 있어 가려지지 않는다. 그래서 가려질 여유가 있는
     쪽(알림)을 겹침이 큰 자리로 보낸다. */
  .fan {
    position: relative;
    width: 100%;
    margin-inline: auto;
    aspect-ratio: 1 / 0.94;
  }
  /* 화면은 자르지 않는다. 높이를 정하지 않고 사진 비율이 그대로 카드 높이가 되게
     둬서, 찍어 보낸 화면이 위아래로 온전히 들어간다. 대신 세 장을 넓게 벌려
     뒤엣것도 제 몫만큼 보이게 한다. */
  .fan figure {
    position: absolute;
    margin: 0;
    border-radius: 18px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 22px 44px -20px rgba(24, 20, 38, 0.42);
  }
  .fan img { display: block; width: 100%; height: auto; }

  /* 가운데가 가장 높고 좌우가 내려앉는 부채꼴. 겹치는 폭은 좁게 잡는다 —
     뒤 두 장에 적힌 글이 최대한 드러나야 표지가 세 장 몫을 한다. */
  .fan .front { width: 42%; left: 29%; top: 0; z-index: 3; }
  .fan .back-l { width: 37%; left: 0; top: 14%; z-index: 1; transform: rotate(-7deg); }
  .fan .back-r { width: 37%; right: 0; top: 14%; z-index: 2; transform: rotate(7deg); }

  @media (prefers-color-scheme: dark) {
    .fan figure { box-shadow: 0 22px 44px -20px rgba(0, 0, 0, 0.75); }
  }
  :root[data-theme="dark"] .fan figure { box-shadow: 0 22px 44px -20px rgba(0, 0, 0, 0.75); }

  .mark {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 30px;
  }
  .mark-box {
    width: 42px; height: 42px;
    border-radius: 13px;
    background: var(--accent);
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 19px;
  }
  .mark-name { font-size: 17px; font-weight: 750; letter-spacing: -0.02em; }
  .mark-sub { font-size: 13.5px; color: var(--muted); }

  h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 54px);
    line-height: 1.22;
    font-weight: 800;
    letter-spacing: -0.035em;
    text-wrap: balance;
  }

  .lede {
    margin: 22px 0 0;
    /* 옆의 화면 뭉치와 부딪히지 않는 폭. 넓게 두면 마지막 글자가 카드에 잘려
       오타처럼 보인다. */
    max-width: 25em;
    font-size: 19px;
    color: var(--ink2);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 14.5px;
    color: var(--ink2);
  }

  /* ---------- 진행 상황 ----------
     이 문서는 한 장씩 채워나가는 중이다. 어디까지 왔는지가 목차 자리에서
     바로 읽혀야, 다음에 무엇을 찍어 보내면 되는지 헤매지 않는다. */
  .toc { padding: 44px 0 8px; }

  .toc h2 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 750;
    letter-spacing: -0.02em;
  }
  .toc-note { margin: 0 0 22px; font-size: 15.5px; color: var(--muted); }

  .toc-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }

  .toc-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 13px 2px;
    border-bottom: 1px solid var(--line);
  }
  .toc-no {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    min-width: 1.6em;
  }
  .toc-name { flex: 1; font-size: 17px; font-weight: 600; }
  .toc-name a { color: inherit; text-decoration: none; }
  .toc-name a:hover, .toc-name a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

  .state {
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 11px;
    white-space: nowrap;
  }
  .state.done { background: var(--done-soft); color: var(--done); }
  .state.wait { background: var(--wait-soft); color: var(--wait); }

  /* ---------- 장 ---------- */
  .chapter { padding: 56px 0; border-top: 1px solid var(--line); }
  .chapter:first-of-type { border-top: 0; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 9px;
  }

  h2.ch {
    margin: 0;
    font-size: clamp(25px, 3.6vw, 33px);
    line-height: 1.3;
    font-weight: 780;
    letter-spacing: -0.028em;
    text-wrap: balance;
  }

  .ch-lede { margin: 16px 0 0; font-size: 18px; color: var(--ink2); max-width: 34em; }

  /* 아직 안 쓴 장. 무엇을 보내야 하는지 이 자리에서 알려준다. */
  .pending {
    margin-top: 26px;
    border: 1px dashed var(--line);
    background: var(--line-soft);
    border-radius: 14px;
    padding: 20px 22px;
  }
  .pending h3 {
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 750;
    color: var(--wait);
    letter-spacing: -0.01em;
  }
  .pending ol { margin: 0; padding-left: 1.35em; }
  .pending li { font-size: 16px; color: var(--ink2); margin-bottom: 6px; }
  .pending li:last-child { margin-bottom: 0; }
  .pending li b { color: var(--ink); font-weight: 700; }

  /* 나란한 여러 갈래를 늘어놓을 때. 순서가 있는 것이 아니라 각각 다른 이야기라
     번호는 붙이지 않는다 — 위에 짧은 색 막대만 두어 한 덩어리임을 표시한다. */
  .points {
    display: grid;
    gap: 26px;
    margin-top: 30px;
  }
  @media (min-width: 760px) {
    .points { grid-template-columns: repeat(3, 1fr); gap: 32px; }
  }
  .point h3 {
    margin: 0 0 8px;
    padding-top: 14px;
    border-top: 3px solid var(--accent);
    font-size: 18.5px;
    font-weight: 750;
    letter-spacing: -0.02em;
  }
  .point p { margin: 0; font-size: 16.5px; color: var(--ink2); }

  /* 화면에 적힌 글자를 그대로 인용할 때 */
  .ui {
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 0.94em;
    white-space: nowrap;
  }

  footer {
    padding: 40px 0 64px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 15px;
  }
  /* 고지문. 읽히기는 해야 하니 본문보다 한 단만 작게 두고, 줄길이를 좁혀
     한눈에 "이건 각주구나" 하고 넘어갈 수 있게 한다. */
  footer .notice {
    margin: 0 0 14px;
    max-width: 38em;
    font-size: 13.5px;
    line-height: 1.65;
  }
  footer .sign { margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<!-- ══════════ 표지 ══════════ -->
<header class="cover">
  <div class="cover-wrap">
    <div class="cover-grid">
      <div>
        <div class="mark">
          <span class="mark-box" aria-hidden="true">모</span>
          <span>
            <span class="mark-name">모아콘</span><br>
            <span class="mark-sub">사용 안내</span>
          </span>
        </div>

        <h1>받아두고<br>잊어버린 기프티콘.</h1>

        <p class="lede">
          사진 한 장만 올리면 상품명·금액·유효기한을 알아서 채웁니다.
          가족이 같은 목록을 보고, 기한이 오기 전에 폰으로 알려드려요.
        </p>

        <div class="chips">
          <span class="chip">설치 없이 웹으로</span>
          <span class="chip">초대코드 6자리로 가족 연결</span>
          <span class="chip">안드로이드 · 아이폰</span>
        </div>
      </div>

      <!-- 뒤에 깔리는 두 장을 먼저 놓아야 앞의 목록이 위로 올라온다. -->
      <div class="fan">
        <figure class="back-l">
          <img src="shots/barcode.jpg" alt="카드를 눌러 바코드가 크게 뜬 화면">
        </figure>
        <figure class="back-r">
          <img src="shots/push.jpg" alt="유효기한이 하루 남았다고 폰에 뜬 알림">
        </figure>
        <figure class="front">
          <img src="shots/list.jpg" alt="아빠·엄마·아들이 받은 기프티콘이 남은 날짜와 함께 모여 있는 목록">
        </figure>
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ══════════ 진행 상황 ══════════ -->
  <section class="toc">
    <h2>차례</h2>
    <p class="toc-note">위에서부터 한 장씩 채웁니다. 지금 어디까지 왔는지 여기서 보세요.</p>

    <ul class="toc-list" id="toc"></ul>
  </section>

  <!-- ══════════ 각 장 ══════════ -->
  <div id="chapters"></div>

  <!-- 화면 캡처 안에 실제 상호가 그대로 나온다. 기프티콘 관리 앱이 "스타벅스
       기프티콘"이라는 말 없이 기능을 설명할 방법이 없어서, 상표를 우리 상품의
       표지로 쓰는 것이 아니라 무엇을 가리키는지 말하는 용도다. 다만 브로셔는
       밖으로 나가는 물건이라, 제휴로 오해할 여지 하나만은 글로 닫아둔다.
       로고는 쓰지 않는다 — 썸네일은 직접 그린 그림이다. -->
  <footer class="wrap narrow">
    <p class="notice">
      화면 속 상호·상품명은 사용법을 설명하기 위한 예시이며, 각 상표는 해당 권리자의
      것입니다. 모아콘은 표시된 브랜드와 제휴 관계가 없습니다.
    </p>
    <p class="sign">모아콘 사용 안내 · 만드는 중</p>
  </footer>

</div>

<script>
  /* 장 하나하나가 여기서 나온다. 다 쓴 장은 body를 채우고 state를 'done'으로 바꾼다.
     아직인 장은 need에 "무엇을 찍어 보내야 하는지"를 적어둔다 — 그게 곧 다음 할 일이다. */
  const CHAPTERS = [
    {
      id: 'intro',
      no: '0',
      label: '표지',
      title: '모아콘이 하는 일',
      lede: '표지의 화면 세 장이 이 앱의 전부입니다. 모으고, 알려주고, 꺼내 보여줍니다.',
      state: 'done',
      body: `
        <div class="points">
          <div class="point">
            <h3>한 곳에 모입니다</h3>
            <p>받은 기프티콘을 사진으로 올리면 목록이 됩니다. 누가 받은 것인지
               이름표가 붙어서, 가족이 같은 목록을 봅니다.</p>
          </div>
          <div class="point">
            <h3>기한 전에 알려줍니다</h3>
            <p>유효기간이 가까워지면 폰으로 알림이 옵니다. 받아두고 잊어버려
               그냥 지나가는 일이 없어집니다.</p>
          </div>
          <div class="point">
            <h3>계산대에서는 누르기만</h3>
            <p>카드를 누르면 바코드가 크게 뜹니다. 계산대 앞에서 사진첩을
               뒤질 일이 없습니다.</p>
          </div>
        </div>`,
    },
    {
      id: 'start',
      no: '1',
      label: '시작하기',
      title: '로그인하고 들어오기',
      lede: '비밀번호는 없습니다. 카카오·구글·네이버 계정이나 이메일 링크로 들어옵니다.',
      state: 'wait',
      need: [
        '<b>로그인 화면</b> — 버튼 네 개가 다 보이게',
        '<b>최근 로그인 표시가 붙은 로그인 화면</b> — 한 번 로그인했다 로그아웃하면 말풍선이 붙습니다',
        '<b>약관 동의 화면</b>',
        '<b>설치 안내 띠</b> — 화면 맨 위 <span class="ui">홈 화면에 추가하면…</span> 줄',
      ],
    },
    {
      id: 'family',
      no: '2',
      label: '가족 만들기',
      title: '가족을 만들거나, 초대코드로 참여하기',
      lede: '코드를 아는 사람만 신청할 수 있고, 신청은 승인해야 들어옵니다.',
      state: 'wait',
