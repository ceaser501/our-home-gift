name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포는 한 번에 하나만 돌 수 있어서 줄을 세운다.
#
# cancel-in-progress를 켜두면 앞선 배포가 도는 중에 새로 푸시했을 때 앞엣것을 죽인다.
# 마지막 것만 올라가니 결과는 같아 보이지만, 실제로는 그렇지 않았다 — 커밋을 몇 분 간격으로
# 연달아 밀면 중간 배포가 통째로 사라지고, 그 커밋의 변경은 다음 푸시가 있을 때까지 앱에
# 반영되지 않는다. 고쳤는데 안 고쳐졌다고 한참을 헤맸다.
#
# 취소 대신 기다리게 둔다. 배포가 조금 밀릴 뿐 빠지는 커밋이 없다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
          VITE_RESET_TOKEN: ${{ secrets.VITE_RESET_TOKEN }}
        run: npm run build

      # 관리자 대시보드(admin/)는 앱과 무관한 정적 파일 하나라 vite 빌드를 거치지 않는다.
      # 빌드 결과 옆에 그대로 얹어 /admin/ 주소로 열리게 한다.
      # 시안(mockups/)은 고르기 위한 미리보기라 배포하지 않는다.
      #
      # 로그인에 쓸 접속 정보는 앱과 같은 값을 넣어준다. 둘 다 브라우저에 공개되는 값이라
      # (앱 번들에도 그대로 들어 있다) 비밀이 아니지만, 저장소에 적어두지는 않는다.
      # 파일에 그대로 쓰면 값에 들어 있는 /와 &를 sed가 잘못 읽으므로 환경변수로 넘긴다.
      - name: Copy admin dashboard
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p client/dist/admin
          python3 - <<'PY'
          import os, pathlib
          html = pathlib.Path('admin/index.html').read_text(encoding='utf-8')
          html = html.replace('__SUPABASE_URL__', os.environ['SUPABASE_URL'].rstrip('/'))
          html = html.replace('__SUPABASE_ANON_KEY__', os.environ['SUPABASE_ANON_KEY'])
          pathlib.Path('client/dist/admin/index.html').write_text(html, encoding='utf-8')
          PY
          cp admin/manifest.json client/dist/admin/
          # 관리자는 앱과 다른 아이콘을 쓴다(딥 퍼플). 이 줄이 없으면 manifest가
          # 가리키는 아이콘이 배포에 없어서 설치 아이콘이 깨진다.
          cp admin/favicon.ico admin/icon.svg admin/icon*.png client/dist/admin/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 짧게 자르지 않는다. 한 번 4분으로 줄여봤다가 오히려 일을 키웠다.
    #
    # 작업이 시간 제한에 걸리면 실패가 아니라 "취소"로 끝나는데, 그러면 Pages 쪽에 배포가
    # 진행 중인 채로 남는다. 그 하나가 이후 모든 배포를 막는다("Please cancel <SHA> first").
    # 즉 빨리 포기하게 만든 것이 자리를 비켜주기는커녕 자리를 잠가버렸다.
    #
    # 게시가 밀릴 때는 그냥 기다리는 편이 낫다. deploy-pages 액션 자체가 10분 뒤 스스로
    # 실패하므로(그때는 배포도 같이 정리된다) 여기서는 그보다 넉넉하게만 둔다.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
