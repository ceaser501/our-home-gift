name: Build Android APK

# 안드로이드 앱은 GitHub Pages처럼 푸시할 때마다 나가지 않는다. 앱을 새로 나눠주는 건
# 받는 사람이 직접 설치해야 하는 일이라, 태그를 달아 "이번 것을 배포한다"고 짚을 때만 돈다.
#
#   git tag app-v1.0.0 && git push origin app-v1.0.0
#
# 화면은 앱 안에 담겨 나가므로(app/capacitor.config.ts), 화면을 고쳤을 때도 새로 빌드해야
# 앱에 반영된다. 웹 배포만으로는 앱이 바뀌지 않는다.
on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  # 빌드한 APK를 Release에 붙이려면 쓰기 권한이 필요하다.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 태그로 돌렸으면 app-v1.0.0 → 1.0.0. 수동으로 돌렸을 때는 붙일 이름이 없어서
      # 실행 번호로 대신한다(시험 삼아 돌려보는 경우다).
      - name: Resolve version
        id: version
        run: |
          REF="${{ github.ref_name }}"
          case "$REF" in
            app-v*) VERSION="${REF#app-v}" ;;
            *) VERSION="0.0.${{ github.run_number }}" ;;
          esac
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "이번 빌드: $VERSION (versionCode ${{ github.run_number }})"

      # 테스트용으로 남겨둔 전체 초기화 기능이 아직 살아 있는지 본다.
      #
      # RESET_TOKEN은 VITE_ 변수로 화면에 전달되는데, VITE_ 값은 브라우저 번들에 문자열로
      # 심긴다 — 비밀이 될 수 없다. 즉 배포된 자바스크립트를 읽는 누구나 그 토큰으로
      # 가족·기프티콘·이미지·계정을 통째로 지울 수 있다.
      #
      # 지금은 브로셔용 스크린샷을 찍느라 일부러 남겨둔 것이라 빌드를 막지 않는다.
      # 다만 APK를 만드는 순간은 "이걸 남에게 준다"는 뜻이라, 그때마다 눈에 띄게 알린다.
      # 출시할 때는 이 단계를 exit 1로 바꿔서 아예 못 나가게 한다.
      - name: Check test-only leftovers
        run: |
          if [ -d supabase/functions/reset-all-data ]; then
            echo "::warning title=전체 초기화 기능이 아직 있습니다::스토어 출시 전에 반드시 제거하세요. RESET_TOKEN이 배포된 JS에 평문으로 들어갑니다. 제거 목록은 docs/store-release.md 맨 위에 있습니다."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 앱 안에 담길 화면. 이 단계가 실패하면 화면 없는 앱이 나온다.
      # MOACON_DEV_SERVER는 일부러 주지 않는다 — 원격 주소를 띄우는 빌드는 스토어에서
      # 리젝되고(애플 2.5.2/4.2), 나눠줘서도 안 된다.
      - name: Build web assets
        working-directory: client
        env:
          # 앱은 화면을 https://localhost/ 루트에서 연다. 웹 기본값(/our-home-gift/)을
          # 그대로 쓰면 자바스크립트를 못 찾아 흰 화면만 뜬다.
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # 브로셔용 스크린샷을 찍는 동안만 테스트 메뉴를 띄운다. 비밀이 아니다 —
          # 실제 초기화 권한은 서버가 관리자 명단으로 확인한다.
          # 출시 전에 이 줄을 지운다(docs/store-release.md).
          VITE_TEST_TOOLS: '1'
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}
        run: |
          npm ci
          # 화면을 한 번 띄워보고 훑기를 끝까지 돌려본다. 여기서 막히면 APK를 만들지
          # 않는다 — 흰 화면으로 켜지는 판이 두 번 나갔고, 두 번 다 여기서 걸렸을 것이다.
          npm test
          npm run build

      - name: Sync Capacitor
        working-directory: app
        run: |
          npm ci
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 서명 키는 저장소에 없다. base64로 시크릿에 넣어둔 것을 여기서만 파일로 푼다.
      # 작업이 끝나면 실행 환경이 통째로 사라지므로 따로 지울 필요는 없다.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다. README의 '앱 서명 키 만들기'를 먼저 해주세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moacon.keystore"

      # 알림(FCM) 설정 파일. 파이어베이스 콘솔에서 받은 google-services.json을 base64로
      # 시크릿에 넣어둔 것이다. 저장소에 두지 않는 이유는 서명 키와 같다 — 프로젝트를
      # 가리키는 값이 그대로 들어 있어서다.
      #
      # 없으면 빌드는 그대로 진행한다(gradle이 파일 유무로 갈라진다). 대신 그 APK는
      # 앱 알림이 안 켜지므로, 조용히 넘어가지 않고 경고를 남긴다.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON 시크릿이 없어 앱 알림 없이 빌드합니다."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/android/app/google-services.json
          echo "google-services.json 복원 완료"

      - name: Build signed APK
        working-directory: app/android
        env:
          MOACON_KEYSTORE_PATH: ${{ runner.temp }}/moacon.keystore
          MOACON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOACON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOACON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # 폰은 versionCode로만 새 버전인지 판단한다. 실행 번호는 늘 커지므로 그대로 쓴다.
          MOACON_VERSION_CODE: ${{ github.run_number }}
          MOACON_VERSION_NAME: ${{ steps.version.outputs.name }}
        # 두 가지를 만든다. 쓰임이 다르다.
        #   APK — 링크로 직접 나눠주는 용도. 폰이 바로 설치할 수 있다.
        #   AAB — Play 스토어에 올리는 용도. Play는 APK를 받지 않는다.
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      # 이름에 버전을 넣어둔다. 받아두고 나중에 "내가 받은 게 어느 것이더라"를 파일
      # 이름만 보고 알 수 있어야 한다.
      - name: Collect artifacts
        id: apk
        run: |
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk \
             "out/moacon-${{ steps.version.outputs.name }}.apk"
          cp app/android/app/build/outputs/bundle/release/app-release.aab \
             "out/moacon-${{ steps.version.outputs.name }}.aab"
          echo "path=out/moacon-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_OUTPUT"

      # AAB는 Release에 붙이지 않는다. 사람이 받아서 쓸 수 있는 파일이 아니라서, 옆에
      # 놓아두면 APK 대신 그걸 받아보고 안 열린다고 하는 일이 생긴다. Play에 올릴 때만
      # 여기서 꺼내 쓴다.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moacon-${{ steps.version.outputs.name }}
          path: out/

      # 태그로 돌렸을 때만 Release를 만든다. 수동 실행은 시험 삼아 돌려보는 경우라
      # 위 첨부까지만 하고, 나눠줄 링크는 만들지 않는다.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          안드로이드용 설치 파일입니다. 아래 `.apk`를 **폰에서** 받아 설치해주세요.

          설치가 처음이라면 경고가 두어 번 뜹니다. 정상입니다:

          1. "이런 유형의 파일은 기기에 위험을 줄 수 있습니다" → 그대로 받기
          2. "이 출처의 앱 설치 허용" → 켜기
          3. Play Protect 경고 → "자세히" → "무시하고 설치"

          아이폰은 이 파일을 쓸 수 없습니다.
          https://ceaser501.github.io/our-home-gift/ 로 접속해서 홈 화면에 추가해주세요.
          NOTES
          # 이미 있으면 만들지 않고 파일만 갈아 끼운다.
          #
          # gh release create는 같은 이름이 있으면 그냥 실패한다. 빌드가 다 끝난 뒤 마지막
          # 줄에서 터지므로, 화면에는 "빌드 실패"로 보이고 실제로는 apk가 다 만들어진
          # 상태다. 같은 태그로 한 번 더 돌리는 일은 드물지 않다 — 네트워크로 job이
          # 끊겨 재실행하거나, 첫 판이 릴리스만 만들어놓고 죽은 경우다.
          tag="${{ github.ref_name }}"
          apk="${{ steps.apk.outputs.path }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice title=이미 있는 릴리스::$tag 에 파일만 새로 올립니다."
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "모아콘 앱 ${{ steps.version.outputs.name }}" \
              --notes-file notes.md
          fi

      # 릴리스가 만들어지면 받는 곳들을 메일로 보낸다.
      #
      # 폰에서 설치할 사람이 매번 저장소 → Releases → 새 태그를 찾아 들어가는 대신,
      # 지메일함에서 링크 한 번으로 받게 하려는 것이다. APK 하나만 적던 것을 셋으로
      # 늘렸다 — 아이폰 쓰는 사람에게 APK만 보내면 받을 것이 없고, 관리자 화면은
      # 주소를 아는 사람이 적어서 물어보고서야 들어갔다. Gmail의 SMTP로 보내므로 따로
      # 드는 돈이 없다. 시크릿 두 개(GMAIL_ADDRESS, GMAIL_APP_PASSWORD)가 없으면
      # 조용히 건너뛴다 — 메일은 곁가지라, 이것 때문에 빌드가 실패로 보이면 안 된다.
      # (시크릿이 있는지는 여기가 아니라 아래에서 본다 — if: 안에서는 secrets를 읽을 수 없다.)
      #
      # 받는 사람을 늘리려면 MAIL_TO_EXTRA 시크릿에 쉼표로 이어 적는다. 주소를 파일에
      # 박지 않는 이유는 이 저장소가 공개라서다 — 남의 메일 주소는 커밋 기록에 남으면
      # 지워도 남는다. 시크릿에 두면 저장소를 열어봐도 안 보이고, 사람이 늘거나 빠질 때
      # 코드를 안 고쳐도 된다.
      - name: Mail download link
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO_EXTRA: ${{ secrets.MAIL_TO_EXTRA }}
        run: |
          if [ -z "$GMAIL_ADDRESS" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "메일 시크릿이 없어 건너뜁니다."
            exit 0
          fi
          # 보내는 계정은 늘 받는다. 거기에 MAIL_TO_EXTRA를 더한다.
          RCPT_ARGS=()
          TO_LINE=""
          RCPT_N=0
          # '|| [ -n "$one" ]' 가 있어야 마지막 주소가 안 잘린다. 아래 printf에는 끝에
          # 줄바꿈이 없어서, read가 그 줄을 읽고도 실패로 돌려주며 고리를 끝낸다.
          while IFS= read -r one || [ -n "$one" ]; do
            one="$(printf '%s' "$one" | tr -d '[:space:]')"
            [ -z "$one" ] && continue
            RCPT_ARGS+=(--mail-rcpt "$one")
            TO_LINE="${TO_LINE:+$TO_LINE, }$one"
            RCPT_N=$((RCPT_N + 1))
          done < <(printf '%s,%s' "$GMAIL_ADDRESS" "$MAIL_TO_EXTRA" | tr ',' '\n')
          echo "받는 사람 ${RCPT_N}명"
          VERSION="${{ steps.version.outputs.name }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/moacon-$VERSION.apk"
          # 웹과 관리자 주소. 저장소 이름에서 만든다 — 이름이 바뀌어도 따라간다.
          PAGES="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}"
          # 한글 제목은 MIME으로 감싸야 안 깨진다.
          SUBJECT="=?UTF-8?B?$(printf '모아콘 %s — 설치해서 봐주세요' "$VERSION" | base64 -w0)?="
          # 글자만 읽는 메일 프로그램을 위해 두 벌로 보낸다(multipart/alternative).
          # 앞에 둔 것이 텍스트, 뒤가 HTML이다 — 뒤엣것을 읽을 수 있으면 그것을 쓴다.
          B="=_moacon_$VERSION"
          cat > mail.txt <<MAIL
          From: moacon build <$GMAIL_ADDRESS>
          To: $TO_LINE
          Subject: $SUBJECT
          MIME-Version: 1.0
          Content-Type: multipart/alternative; boundary="$B"

          --$B
          Content-Type: text/plain; charset=UTF-8
          Content-Transfer-Encoding: 8bit

          모아콘 $VERSION 이 나왔어요. 설치해서 봐주세요.

          안드로이드 앱 (APK)
          $URL

          웹 — 아이폰·PC는 이쪽입니다
          $PAGES/

          모아콘 관리자 — 명단에 올라 있는 계정만 들어갑니다
          $PAGES/admin/

          --$B
          Content-Type: text/html; charset=UTF-8
          Content-Transfer-Encoding: 8bit

          <meta charset="utf-8">
          <div style="margin:0;padding:0;background:#f4f3f8;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f3f8;padding:26px 14px;">
          <tr><td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:470px;width:100%;border-collapse:separate;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">

          <tr><td style="background:#241C6B;border-radius:18px 18px 0 0;padding:28px 24px 24px;text-align:center;">
          <img src="$PAGES/icon-192.png" width="54" height="54" alt="" style="display:block;margin:0 auto 13px;width:54px;height:54px;border:0;">
          <div style="font-size:20px;font-weight:800;color:#ffffff;letter-spacing:-0.02em;line-height:1.3;">모아콘 $VERSION 이 나왔어요</div>
          <div style="font-size:13.5px;color:#c9c3f0;line-height:1.6;margin-top:7px;">설치해서 한 번 봐주세요</div>
          </td></tr>

          <tr><td style="background:#ffffff;padding:24px 20px 22px;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e7e5f0;border-radius:14px;border-collapse:separate;">
          <tr><td style="padding:17px 17px 15px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
          <td width="44" style="padding-right:12px;vertical-align:top;">
          <img src="$PAGES/icon-192.png" width="44" height="44" alt="" style="display:block;width:44px;height:44px;border:0;">
          </td>
          <td style="vertical-align:top;">
          <div style="font-size:15.5px;font-weight:800;color:#1c1b22;letter-spacing:-0.02em;line-height:1.35;">안드로이드 앱</div>
          <div style="font-size:12.5px;color:#6b6879;line-height:1.6;margin-top:3px;">폰에서 눌러 받으세요. 이 판 그대로입니다.</div>
          </td></tr></table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:13px;">
          <tr><td style="background:#5b4fe8;border-radius:11px;">
          <a href="$URL" style="display:block;padding:13px 16px;text-align:center;font-size:14.5px;font-weight:700;color:#ffffff;text-decoration:none;letter-spacing:-0.01em;">APK 받기</a>
          </td></tr></table>
          </td></tr></table>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e7e5f0;border-radius:14px;border-collapse:separate;margin-top:11px;">
          <tr><td style="padding:17px 17px 15px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
          <td width="44" style="padding-right:12px;vertical-align:top;">
          <img src="$PAGES/icon-192.png" width="44" height="44" alt="" style="display:block;width:44px;height:44px;border:0;">
          </td>
          <td style="vertical-align:top;">
          <div style="font-size:15.5px;font-weight:800;color:#1c1b22;letter-spacing:-0.02em;line-height:1.35;">웹</div>
          <div style="font-size:12.5px;color:#6b6879;line-height:1.6;margin-top:3px;">아이폰과 PC는 이쪽입니다. 홈 화면에 추가하면 앱처럼 열려요.</div>
          </td></tr></table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:13px;">
          <tr><td style="border:1px solid #d9d6e6;border-radius:11px;">
          <a href="$PAGES/" style="display:block;padding:12px 16px;text-align:center;font-size:14.5px;font-weight:700;color:#241C6B;text-decoration:none;letter-spacing:-0.01em;">웹에서 열기</a>
          </td></tr></table>
          </td></tr></table>

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e7e5f0;border-radius:14px;border-collapse:separate;margin-top:11px;">
          <tr><td style="padding:17px 17px 15px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
          <td width="44" style="padding-right:12px;vertical-align:top;">
          <img src="$PAGES/admin/icon-192.png" width="44" height="44" alt="" style="display:block;width:44px;height:44px;border:0;">
          </td>
          <td style="vertical-align:top;">
