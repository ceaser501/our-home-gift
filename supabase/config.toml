# naver-auth는 네이버가 브라우저를 직접 리다이렉트시켜서 호출하는 함수라 Authorization
# 헤더(JWT)가 없다. 기본값(true)이면 Supabase가 요청을 401로 막아버리므로 꺼둔다.
[functions.naver-auth]
verify_jwt = false

# send-expiry-notifications는 pg_cron이 정해진 시간에 직접 호출하는 함수라 역시
# Authorization 헤더가 없다. 대신 함수 안에서 CRON_SECRET 쿼리 파라미터로 검증한다.
[functions.send-expiry-notifications]
verify_jwt = false

# admin-stats는 로그인 토큰을 받지만, 기본값(verify_jwt = true)에 맡기지 않는다. 그 검사는
# anon key도 통과시켜서(브라우저 번들에 들어 있다) 인증이라 할 수 없기 때문이다. 대신 함수
# 안에서 auth 서버에 직접 물어보고(진짜 사용자인지), 관리자 명단까지 확인한다.
[functions.admin-stats]
verify_jwt = false
