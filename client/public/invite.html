<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="only light" />
    <title>모아콘 · 가족 초대</title>

    <!--
      카톡으로 받은 초대를 눌렀을 때 처음 닿는 자리.

      ── 왜 필요한가 ──────────────────────────────────────────────────────────
      카톡에서 링크를 누르면 카톡 안의 브라우저가 열린다. 초대 주소가 곧장 웹 화면이면
      앱을 이미 깐 사람도 카톡 안의 웹으로 들어간다 — 앱은 그대로 놔둔 채 웹에 또
      로그인해야 하고, 앱을 안 깐 사람은 앱이 있다는 것조차 모르고 지나간다.

      그래서 웹 화면을 바로 열지 않고 여기서 한 번 갈라준다.

        앱이 깔려 있으면  → 앱이 열리고 초대 코드가 그대로 실려 간다
        앱이 없으면       → 아래 '앱이 없을 때' 참고

      ── 어떻게 가르나 ────────────────────────────────────────────────────────
      "앱이 깔렸는지"를 물어볼 방법은 없다. 대신 안드로이드에는 intent: 주소가 있다 —
      앱이 있으면 열고, 없으면 S.browser_fallback_url 로 보낸다. 판단을 안드로이드가
      대신 해주므로 우리가 초를 세거나 짐작할 일이 없다.

      아이폰에는 그런 길이 없다. 스킴으로 열어보고, 앱이 떴는지를 우리가 재야 한다.
      재는 방법은 화면이다 — 앱이 뜨면 이 페이지가 가려지고(visibilitychange), 안 뜨면
      그대로 있다. 잠깐 기다려보고 그대로면 안 열린 것으로 친다. 카톡 열기가 쓰는 것과
      같은 방법이다(client/src/utils/inviteLink.js의 wentToKakao).

      완벽하지는 않다. 사람이 그사이 손수 앱을 내리면 열린 것으로 잘못 읽는다. 그래도
      실패하는 쪽이 '스토어로 간다'라서 막다른 길은 아니다.

      아이폰은 눌러야 연다. 페이지가 뜨자마자 스킴을 열면 사파리·카톡 웹뷰가 막는다.

      ── 앱이 없을 때 ─────────────────────────────────────────────────────────
      스토어로 보낸다. 단, 그 스토어에 앱이 실제로 올라가 있어야 한다 — 없는데 보내면
      '찾을 수 없는 페이지'가 뜬다. 그래서 스토어 주소가 비어 있으면 웹 화면으로 보낸다.
      웹에서도 참여는 그대로 된다.

      ── 스토어 주소를 둘로 나눠 둔 이유 ──────────────────────────────────────
      처음에는 STORE_URL 한 줄이었다. 두 스토어가 같은 날 열린다고 보고 쓴 것인데
      실제로는 App Store 만 먼저 열렸다(2026-09-14). 한 줄을 애플 주소로 채우면 그 값이
      안드로이드 intent 의 S.browser_fallback_url 로도 들어가서, 앱 없는 안드로이드
      사용자가 App Store 페이지로 간다. 그래서 STORE_URL_IOS / STORE_URL_ANDROID 로
      갈랐다. Play 가 프로덕션으로 열리면 안드로이드 쪽 한 줄을 채운다.

      ── 아이폰은 STORE_URL_IOS 가 채워졌는지로 갈린다 ────────────────────────
      비어 있으면 웹이 주 버튼이다. 스토어에 없는 앱의 '앱으로 열기'를 크게 세우면
      대부분에게 눌러도 아무 일 안 일어나는 버튼이 제일 크게 서 있는 셈이 된다.

      채워지면(지금) 앱이 주 버튼이 된다. 눌러서 앱이 뜨면 그대로 끝이고, 안 뜨면
      스토어로 간다 — 앱이 없는 사람에게도 갈 곳이 생기므로 앱을 앞에 세워도 된다.

      앱을 안 깐 아이폰에서는 스킴을 열어보는 순간 사파리가 '주소가 올바르지 않습니다'
      알림을 한 번 띄울 수 있다. 확인을 누르면 1.4초 뒤 스토어로 간다. 커스텀 스킴을
      쓰는 값이고, Universal Links 로 올리면 사라진다(docs/after-launch.md 4번).
    -->
    <style>
      :root { color-scheme: only light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fbfbfd;
        color: #1c1e27;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', Roboto, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 32px 24px;
        text-align: center;
        width: 100%;
        max-width: 360px;
      }
      img { width: 64px; height: 64px; }
      h1 { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.028em; word-break: keep-all; }
      p { margin: 0; font-size: 14.5px; line-height: 1.6; color: #71717f; word-break: keep-all; }
      .code {
        margin-top: 4px;
        padding: 8px 16px;
        border-radius: 11px;
        background: #f0efff;
        color: #5b4fe8;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .buttons { margin-top: 14px; display: flex; flex-direction: column; gap: 9px; width: 100%; }
      button {
        height: 52px;
        width: 100%;
        border: 0;
        border-radius: 13px;
        background: #5b4fe8;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
      }
      button.quiet { background: transparent; color: #71717f; height: 44px; font-size: 14.5px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.svg" alt="모아콘" />
      <h1 id="title">모아콘으로 가는 중…</h1>
      <p id="note">잠시만 기다려주세요.</p>
      <p class="code" id="code" hidden></p>
      <div class="buttons">
        <button id="open" hidden>모아콘 앱으로 열기</button>
        <button id="web" class="quiet" hidden>웹으로 계속하기</button>
      </div>
    </main>

    <script>
      (function () {
        // 앱을 여는 주소. 안드로이드는 strings.xml, 아이폰은 Info.plist에 같은 값이 있다.
        var SCHEME = 'io.github.ceaser501.moacon';
        // 안드로이드가 "이 앱이 깔렸나"를 판단할 때 쓴다. app/android/app/build.gradle.
        var PACKAGE = 'io.github.ceaser501.ourhomegift';
        // 스토어 주소. 스토어마다 따로 둔다 — 하나로 묶으면 안드로이드 쪽 fallback 에
        // 애플 주소가 들어가서, 앱 없는 안드로이드 사용자가 App Store 로 간다.
        // 비어 있는 쪽은 웹으로 보낸다(위 주석 참고).
        var STORE_URL_IOS = 'https://apps.apple.com/app/id6808555980';
        // Play 는 아직 비공개 테스트다. 프로덕션이 열리기 전에 채우면 초대받은 사람이
        // '찾을 수 없는 페이지'를 본다. 열리면 아랫줄로 바꾼다.
        //   var STORE_URL_ANDROID = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
        var STORE_URL_ANDROID = '';

        var params = new URLSearchParams(location.search);
        var code = (params.get('join') || params.get('code') || '').trim().toUpperCase().slice(0, 12);
        var family = (params.get('family') || '').trim();

        var webUrl = location.origin + location.pathname.replace(/invite\.html$/, '') + (code ? '?join=' + encodeURIComponent(code) : '');
        var appUrl = SCHEME + '://invite?join=' + encodeURIComponent(code);
        // 안드로이드 intent 가 '앱이 없을 때' 보내는 곳. 안드로이드 쪽 값만 쓴다.
        var fallback = STORE_URL_ANDROID || webUrl;

        var title = document.getElementById('title');
        var note = document.getElementById('note');
        var codeBox = document.getElementById('code');
        var open = document.getElementById('open');
        var web = document.getElementById('web');
        var buttons = open.parentNode;

        // 코드가 없으면 갈 곳이 없다. 웹 첫 화면으로 보낸다.
        if (!code) {
          location.replace(location.origin + location.pathname.replace(/invite\.html$/, ''));
          return;
        }

        codeBox.textContent = code;
        codeBox.hidden = false;
        web.hidden = false;
        web.addEventListener('click', function () {
          location.href = webUrl;
        });

        // 스토어로 보내기 전에 코드를 클립보드에 적어둔다.
        //
        // 아이폰은 설치 뒤에 "무엇을 눌러서 왔는지"를 앱에 안 넘긴다. 그래서 설치를
        // 마치고 App Store의 '열기'를 누른 사람은 코드 없이 첫 화면에 선다 — 카톡으로
        // 돌아와 다시 눌러야 했다. 애플이 남겨둔 길이 클립보드 하나다.
        //
        // 말머리를 붙이는 이유는 앱이 남의 것을 초대 코드로 잘못 읽지 않게 하기
        // 위해서다. 받는 자리는 client/src/utils/inviteLink.js 의 readInviteFromText.
        var CLIPBOARD_TAG = '모아콘 초대 코드';

        function stash(value) {
          var text = CLIPBOARD_TAG + ' ' + value;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text);
              return;
            }
          } catch (e) { /* 아래 옛 방식으로 내려간다. */ }
          try {
            var field = document.createElement('textarea');
            field.value = text;
            field.setAttribute('readonly', '');
            field.style.position = 'fixed';
            field.style.opacity = '0';
            document.body.appendChild(field);
            field.select();
            document.execCommand('copy');
            document.body.removeChild(field);
          } catch (e) { /* 못 적어도 직접 적는 길이 그대로 있다. */ }
        }

        var isAndroid = /android/i.test(navigator.userAgent);
        var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);

        // 폰이 아니면(피시 카톡·메일 등) 앱이 있을 리 없다. 웹으로 바로 보낸다.
        if (!isAndroid && !isIos) {
          location.replace(webUrl);
          return;
        }

        // 앱이 앞으로 나왔는지 본다. 나왔으면 이 페이지가 가려진다.
        function wentToApp(ms) {
          return new Promise(function (resolve) {
            if (document.hidden) return resolve(true);
            function done(value) {
              clearTimeout(timer);
              document.removeEventListener('visibilitychange', onHide);
              resolve(value);
            }
            function onHide() {
              if (document.hidden) done(true);
            }
            var timer = setTimeout(function () { done(false); }, ms);
            document.addEventListener('visibilitychange', onHide);
          });
        }

        function toApp() {
          if (isAndroid) {
            // 앱이 있으면 열고, 없으면 fallback 으로 간다. 그 판단은 안드로이드가 한다.
            location.href =
              'intent://invite?join=' + encodeURIComponent(code) +
              '#Intent;scheme=' + SCHEME +
              ';package=' + PACKAGE +
              ';S.browser_fallback_url=' + encodeURIComponent(fallback) +
              ';end';
          } else {
            location.href = appUrl;
          }
        }

        if (isAndroid) {
          // 안드로이드는 바로 넘긴다. 앱이 없어도 갈 곳이 정해져 있어서 막다른 길이 없다.
          title.textContent = family ? family + ' 가족의 초대' : '가족 초대를 받았어요';
          note.textContent = '모아콘을 여는 중이에요.';
          open.hidden = false;
          open.addEventListener('click', toApp);
          toApp();
        } else {
          title.textContent = family ? family + ' 가족의 초대' : '가족 초대를 받았어요';
          note.textContent = '이름만 적으면 참여 신청이 끝나요.';
          open.hidden = false;

          if (STORE_URL_IOS) {
            // 앱이 주 버튼이다. 눌러서 안 열리면 스토어로 보낸다.
            open.addEventListener('click', function () {
              // 스토어로 갈지는 1.4초 뒤에 갈리지만 복사는 지금 한다. 사파리는 누른
              // 손짓이 살아 있는 동안에만 클립보드 쓰기를 받아준다 — 타이머 안에서
              // 부르면 그때는 손짓이 식어서 조용히 거절당한다.
              //
              // 앱이 열리는 사람에게도 적히지만 탈은 없다. 그쪽은 코드가 딥링크로
              // 실려 가서 클립보드를 볼 일이 없다.
              stash(code);
              open.textContent = '모아콘을 여는 중…';
              toApp();
              wentToApp(1400).then(function (opened) {
                if (opened) return;
                open.textContent = '모아콘 앱으로 열기';
                location.href = STORE_URL_IOS;
              });
            });
          } else {
            // 아직 스토어에 없다. 웹을 주 버튼으로 두고 앱은 조용한 줄로 내린다.
            web.textContent = '모아콘 시작하기';
            web.className = '';
            open.textContent = '앱으로 열기';
            open.className = 'quiet';
            open.addEventListener('click', toApp);
            buttons.insertBefore(web, open);
          }
        }
      })();
    </script>
  </body>
</html>
