<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A5CFF"/><stop offset="1" stop-color="#E8579B"/>
    </linearGradient>
    <radialGradient id="mgl" cx="18%" cy="12%" r="78%">
      <stop offset="0" stop-color="#C79BFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#C79BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mwl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF0F8"/>
    </linearGradient>
    <linearGradient id="mwb" x1="0" y1="0" x2="0" y2="1">
