<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico?v=6" sizes="any" />
    <link rel="icon" href="icon.svg?v=6" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png?v=6" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icon.png?v=6" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <!-- 크롬의 "웹사이트 자동 어둡게" 기능이 색을 뒤집지 않도록 라이트 전용임을 미리 알린다.
         값이 반드시 "only light"여야 한다. 그냥 "light"는 선호하는 색만 알려줄 뿐이라
         자동 어둡게가 그대로 적용된다. CSS보다 먼저 읽혀서 잠깐 어두워지는 것도 막아준다. -->
    <meta name="color-scheme" content="only light" />
    <!-- 설치해서 쓰면 폰 위쪽 상태바(시계·배터리 자리)가 이 색으로 칠해진다.
         브랜드색(보라)을 넣어두면 앱 배경과 따로 놀아 띠가 하나 얹힌 것처럼 보인다.
         그래서 배경과 같은 색을 넣어 상태바가 화면에 이어지게 한다.
         아래 스크립트가 테마에 맞춰 다시 칠한다. -->
    <meta name="theme-color" content="#ffffff" />
    <title>모아콘</title>
    <meta name="description" content="우리 가족 기프티콘 서랍" />

    <!-- 초대 링크를 카톡·문자로 보냈을 때 뜨는 미리보기.
         없으면 주소만 덩그러니 남아서, 받는 사람이 이게 뭔지 모르고 안 누른다.
         카카오 카드를 쓰는 길에서는 이 값 대신 카드에 적은 것이 나가고, 여기는 그
         길이 아닐 때(문자·메일·다른 메신저)를 받는다. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="모아콘 · 우리 가족 기프티콘 서랍" />
    <meta property="og:description" content="눌러서 이름만 적으면 가족 참여 신청이 끝나요." />
    <meta property="og:url" content="https://ceaser501.github.io/our-home-gift/" />
    <meta property="og:image" content="https://ceaser501.github.io/our-home-gift/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script>
      // 테마는 앱이 그려지기 전에 정해둔다. (예전에는 헤더 안에서 정하다 보니 로그인
      // 화면에서는 테마가 없는 채로 폰 시스템 설정을 그대로 따라갔다.)
      // 사용자가 직접 다크를 고른 적이 없으면 항상 화이트를 기본으로 쓴다.
      (function () {
        var isDark = localStorage.getItem('theme') === 'dark';
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        document.querySelector('meta[name="color-scheme"]').content = isDark ? 'only dark' : 'only light';
        // 상태바 색도 여기서 맞춘다. 값은 index.css의 --background와 같아야 한다.
        document.querySelector('meta[name="theme-color"]').content = isDark ? '#121216' : '#ffffff';
      })();

      // 크롬은 페이지가 뜨자마자 설치 가능 여부를 판단해 beforeinstallprompt를 던진다.
      // 리액트가 그려지기 전에 이벤트가 지나가버리면 설치 버튼을 영영 띄울 수 없으므로
      // (스플래시가 끝나고 로그인 화면이 뜰 때쯤이면 이미 늦다) 여기서 미리 붙잡아 둔다.
      window.__installPromptEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPromptEvent = e;
        window.dispatchEvent(new Event('installpromptready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__installPromptEvent = null;
        window.dispatchEvent(new Event('installpromptready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
