<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>금액 입력 — 잔액 보이기</title>
<script type="module" src="/src/index.css"></script>
<style>
  body { margin:0; background:#3a3a44; font-family:Pretendard, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; }
  .page { display:flex; gap:20px; align-items:flex-start; justify-content:center;
          padding:16px 14px 80px; flex-wrap:wrap; }
  .col { width:375px; flex:0 0 auto; }
  .cap { color:#fff; font-size:13px; font-weight:800; margin:0 0 3px; }
  .sub { color:#b8b8c4; font-size:11px; line-height:1.5; margin:0 0 8px; min-height:48px; }
  .num { color:#9d9daa; font-size:10px; font-weight:700; margin:6px 0 0; font-variant-numeric:tabular-nums; }

  .sheet { background:var(--background); border-radius:16px 16px 0 0; overflow:hidden;
           box-shadow:0 -2px 24px rgba(0,0,0,.28); color:var(--foreground); }
  .hd  { display:flex; flex-direction:column; gap:4px; padding:20px 60px 20px 20px; position:relative; }
  .ttl { font-size:20px; line-height:1.2; font-weight:700; letter-spacing:-.025em; margin:0; }
  .x   { position:absolute; top:10px; right:10px; width:44px; height:44px; display:flex;
         align-items:center; justify-content:center; color:var(--muted-foreground); }
  .x svg { width:24px; height:24px; }
  .bd  { padding:0 20px 20px; display:flex; flex-direction:column; gap:16px; }

  .name { margin:0; font-size:14px; line-height:1.5; font-weight:500; color:var(--muted-foreground);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:-4px; }
  /* 입력 상자 — A 의 것을 그대로 되돌린다 */
  .box  { display:flex; height:56px; align-items:center; gap:10px; border-radius:8px;
          border:1.5px solid var(--primary); background:var(--card); padding:0 15px; }
  .box .v { flex:1; font-size:20px; font-weight:400; color:var(--muted-foreground);
            font-variant-numeric:tabular-nums; }
  .box .w { font-size:16px; font-weight:600; color:var(--muted-foreground); }
  .chip { height:40px; border-radius:6px; border:1px solid var(--input); background:var(--card);
          font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
          color:var(--foreground); font-family:inherit; }
  .btnP { height:52px; border-radius:8px; border:0; background:var(--primary);
          color:var(--primary-foreground); font-size:15.5px; font-weight:700;
          display:flex; align-items:center; justify-content:center; gap:7px; font-family:inherit; }
  .btnP svg { width:20px; height:20px; }
  .tab { font-variant-numeric:tabular-nums; }
  .mut { color:var(--muted-foreground); }
  .rows { display:flex; flex-direction:column; gap:16px; }
</style>

<script>
  const HEAD = `
    <div class="hd">
      <p class="ttl">얼마 쓰셨어요?</p>
      <span class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
    </div>`;
  const NAME = `<p class="name">카페 아메리카노 T 2잔 + 딸기 생크림 케이크</p>`;
  const TAIL = `
    <div class="box"><span class="v">380,000</span><span class="w">원</span></div>
    <div style="display:flex;gap:8px;margin-top:-8px">
      <button class="chip" style="flex:1.25">전액</button>
      <button class="chip" style="flex:1">+1만</button>
      <button class="chip" style="flex:1">+5천</button>
      <button class="chip" style="flex:1">+1천</button>
    </div>
    <button class="btnP"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>이만큼 썼어요</button>`;

  // 잔액을 보이는 세 갈래
  const BAL = {
    가: `
      <div style="display:flex;flex-direction:column;gap:3px">
        <span class="mut" style="font-size:12px;line-height:1.2;font-weight:600">남은 금액</span>
        <div style="display:flex;align-items:baseline;gap:6px">
          <span class="tab" style="font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.025em">380,000</span>
          <span class="mut tab" style="font-size:15px;font-weight:500">/ 500,000원</span>
        </div>
      </div>`,
    나: `
      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <span class="tab" style="font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.025em">
            380,000원 <span style="font-size:14px;font-weight:600">남음</span></span>
          <span class="mut tab" style="font-size:12px;font-weight:500">50만원권</span>
        </div>
        <div style="height:6px;border-radius:99px;background:var(--secondary);overflow:hidden">
          <div style="height:100%;width:76%;border-radius:99px;background:var(--primary)"></div>
        </div>
      </div>`,
    다: `
      <div style="display:flex;flex-direction:column;gap:3px">
        <span class="mut" style="font-size:12px;line-height:1.2;font-weight:600">지금 남은 금액</span>
        <span class="tab" style="font-size:25px;line-height:1;font-weight:700;letter-spacing:-.025em">380,000원</span>
        <span class="mut tab" style="font-size:12px;line-height:1.6;font-weight:500;margin-top:2px">
          50만원권에서 120,000원 썼어요</span>
      </div>`,
  };

  const NOTE = {
    가: '분수 — 태수님이 말씀하신 꼴. 「남은 금액」이라는 말이 위에 있어야 방향이 안 뒤집힌다. 500,000 을 5만원권처럼 줄이지 않은 건 분수는 자릿수가 맞아야 견줘지기 때문이다.',
    나: '막대 — 배터리처럼 찬 만큼이 남은 돈이다. 숫자를 안 읽어도 대충 얼마인지 보인다. 대신 줄이 하나 더 는다.',
    다: '지금 상자 안에 있던 것을 상자만 걷어 그대로 올린 것. 남은 금액이 제일 큰 숫자이고, 얼마 중 얼마인지는 아래 회색 줄이 말한다.',
  };

  addEventListener('DOMContentLoaded', () => {
    const page = document.querySelector('.page');
    Object.keys(BAL).forEach((k) => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<p class="cap">${k} · ${{가:'분수',나:'막대',다:'큰 숫자'}[k]}</p>`
        + `<p class="sub">${NOTE[k]}</p>`
        + `<div class="sheet" id="s${k}">${HEAD}<div class="bd">${NAME}${BAL[k]}${TAIL}</div></div>`
        + `<p class="num" id="n${k}"></p>`;
      page.appendChild(col);
    });
    const measure = () => Object.keys(BAL).forEach((k) => {
      const el = document.getElementById('s' + k);
      document.getElementById('n' + k).textContent =
        `시트 ${Math.round(el.getBoundingClientRect().height)}px · 누를 것 ${el.querySelectorAll('button').length + 1}개`;
    });
    new ResizeObserver(measure).observe(document.body);
    document.fonts.ready.then(() => requestAnimationFrame(measure));
    setTimeout(measure, 500); setTimeout(measure, 1400);
  });
</script>

<div class="page"></div>
