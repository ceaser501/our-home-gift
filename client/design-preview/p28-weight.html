<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>등록 시트를 가볍게</title>
<style>
  :root {
    --foreground: #1c1e27; --muted-foreground: #545461; --card: #fbfbfd;
    --border: #e7e7ec; --input: #e7e7ec; --secondary: #f1f1f5; --primary: #5b4fe8;
    --destructive: #e0453f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #8a8a90; padding: 16px 0 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  h3 { color: #fff; font-size: 13px; font-weight: 800; padding: 0 20px 3px; }
  p.why { color: #e4e4ea; font-size: 12px; line-height: 1.5; padding: 0 20px 10px; }
  .sheet { background: var(--card); border-radius: 20px; margin: 0 8px; padding: 20px; }
  form { display: flex; flex-direction: column; gap: 20px; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { font-size: 14px; font-weight: 600; line-height: 1; color: rgba(28,30,39,.7); }
  .star { color: var(--destructive); font-weight: 700; }
  .f { border-radius: 8px; display: flex; align-items: center; padding: 0 16px;
       font-size: 16px; color: var(--foreground); }
  .f .ar { margin-left: auto; opacity: .45; }
  .f .won { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--muted-foreground); }
  .ta { align-items: flex-start; padding-top: 15px; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 8px; }
  .chk i { width: 18px; height: 18px; border-radius: 4px; background: var(--primary); flex: none;
           display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
  .photo { width: 106px; aspect-ratio: 1; border-radius: 12px; display: flex;
           flex-direction: column; align-items: center; justify-content: center; gap: 2px;
           font-size: 12px; color: var(--muted-foreground); }
  .rule { height: 1px; background: rgba(231,231,236,.6); }
</style>
<div id="out"></div>
<script>
  var AR = '<svg class="ar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';

  var V = [
    { t: '가 · 지금',
      why: '칸마다 테두리. 고르개 셋과 사진 자리는 테두리와 바탕을 둘 다 갖는다. 칸 높이 52.',
      h: 52, edit: 'border', pick: 'both', box: 'border' },
    { t: '나 · 고르개의 바탕만 걷는다',
      why: '테두리 하나로 통일. 「테두리 = 누르는 것」 규칙을 지킨다. 적는 것과 고르는 것은 화살표로 갈린다.',
      h: 52, edit: 'border', pick: 'border', box: 'border' },
    { t: '다 · 테두리를 걷고 바탕만 쓴다',
      why: '선이 열 줄 사라진다. 칸은 바탕으로 서고, 테두리는 정말 누르는 것(버튼)에만 남는다.',
      h: 52, edit: 'fill', pick: 'fill', box: 'fill' },
    { t: '라 · 다 + 칸 높이 48',
      why: '여덟 칸에서 32 가 줄어든다. 44 과녁은 넉넉히 넘는다.',
      h: 48, edit: 'fill', pick: 'fill', box: 'fill' }
  ];

  function sty(kind, h) {
    var s = 'height:' + h + 'px;';
    if (kind === 'border') s += 'border:1px solid var(--input);background:var(--card);';
    if (kind === 'both')   s += 'border:1px solid var(--input);background:color-mix(in srgb,var(--secondary) 50%,transparent);';
    if (kind === 'fill')   s += 'border:0;background:var(--secondary);';
    return s;
  }

  var pick = new URLSearchParams(location.search).get('v');
  var LIST = pick ? [V[{ now:0, noBg:1, fill:2, fill48:3 }[pick] || 0]] : V;

  out.innerHTML = LIST.map(function (v) {
    var E = sty(v.edit, v.h), P = sty(v.pick, v.h);
    var photoS = v.box === 'fill'
      ? 'background:var(--secondary);'
      : 'border:1px dashed var(--border);background:#fff;';
    var chkS = v.box === 'fill'
      ? 'background:var(--secondary);height:' + v.h + 'px;'
      : 'border:1px solid var(--input);background:var(--card);height:' + v.h + 'px;';
    return '<section><h3>' + v.t + '</h3><p class="why">' + v.why + '</p><div class="sheet">' +
      '<div class="photo" style="' + photoS + 'margin-bottom:16px">＋<span>이미지 추가</span></div>' +
      '<div class="rule" style="margin-bottom:16px"></div><form>' +
      '<div class="grp"><label>상품명 <span class="star">*</span></label>' +
        '<div class="f" style="' + E + '">카페 아메리카노 T 2잔</div></div>' +
      '<div class="two">' +
        '<div class="grp"><label>상호</label><div class="f" style="' + E + '">스타벅스</div></div>' +
        '<div class="grp"><label>카테고리</label><div class="f" style="' + P + '">기타' + AR + '</div></div>' +
      '</div>' +
      '<div class="two">' +
        '<div class="grp"><label>바코드 번호</label><div class="f" style="' + E + '">8801234…</div></div>' +
        '<div class="grp"><label>금액</label><div class="f" style="' + E + '">500,000<span class="won">원</span></div></div>' +
      '</div>' +
      '<div class="chk" style="' + chkS + '"><i>✓</i>금액권 — 쓴 만큼 깎여요</div>' +
      '<div class="grp"><label>사용기한</label><div class="f" style="' + P + '">2026. 09. 03.' + AR + '</div></div>' +
      '<div class="grp"><label>받는 사람</label><div class="f" style="' + P + '">태수' + AR + '</div></div>' +
      '<div class="grp"><label>메모</label><div class="f ta" style="' + E.replace(/height:\d+px/, 'height:76px') + '">엄마가 준 것</div></div>' +
      '</form></div></section>';
  }).join('');
</script>
