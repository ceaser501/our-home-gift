<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>기한 연장 — D-day 와 2/2 블럭</title>
<script type="module" src="/src/index.css"></script>
<style>
  body { margin:0; background:#3a3a44; font-family:Pretendard, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; color:#fff; }
  .page { display:flex; gap:20px; align-items:flex-start; justify-content:center;
          padding:16px 14px 80px; flex-wrap:wrap; }
  .col { width:375px; flex:0 0 auto; }
  .cap { font-size:13px; font-weight:800; margin:0 0 3px; }
  .sub { color:#b8b8c4; font-size:11px; line-height:1.5; margin:0 0 8px; min-height:64px; }
  .st  { color:#9d9daa; font-size:10px; font-weight:700; margin:14px 0 4px; }
  .hr  { border:0; border-top:1px solid #55555f; margin:26px 0 18px; }
  .h2  { font-size:13px; font-weight:800; margin:0 0 10px; }

  .sheet { background:var(--background); color:var(--foreground);
           border-radius:16px 16px 0 0; overflow:hidden; box-shadow:0 -2px 24px rgba(0,0,0,.28); }
  .hd  { display:flex; flex-direction:column; gap:4px; padding:20px 60px 20px 20px; position:relative; }
  .ttl { font-size:20px; line-height:1.2; font-weight:700; letter-spacing:-.025em; margin:0;
         word-break:keep-all; }
  .x   { position:absolute; top:10px; right:10px; width:44px; height:44px; display:flex;
         align-items:center; justify-content:center; color:var(--muted-foreground); }
  .x svg { width:24px; height:24px; }
  .bd  { padding:0 20px 20px; display:flex; flex-direction:column; gap:14px; }
  .steps { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .steps i { display:block; height:4px; width:22px; border-radius:99px; background:var(--input); }
  .steps i.on { background:var(--primary); }
  .steps b { font-size:12px; font-weight:700; color:var(--muted-foreground);
             font-variant-numeric:tabular-nums; margin-left:4px; }

  .desc { margin:0; font-size:14px; line-height:1.5; font-weight:500; color:var(--muted-foreground);
          display:flex; align-items:center; gap:7px; }
  .desc .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .desc .sp { flex:1; }

  /* 카드의 D-day 뱃지와 같은 옷 — 채운 알약, 급하면 빨강 */
  .dd  { flex:0 0 auto; border-radius:99px; padding:2px 8px; font-size:12px; font-weight:700;
         font-variant-numeric:tabular-nums; background:var(--destructive); color:#fff;
         line-height:1.4; }
  .ddText { flex:0 0 auto; font-size:13px; font-weight:700; color:var(--destructive);
            font-variant-numeric:tabular-nums; }

  .body { margin:0; font-size:14px; line-height:1.6; font-weight:500;
          color:var(--muted-foreground); word-break:keep-all; }
  .rows { margin:0 -20px; border-top:1px solid var(--border); }
  .row  { display:flex; align-items:center; gap:12px; padding:14px 20px;
          border-bottom:1px solid var(--border); }
  .row .t { font-size:15px; font-weight:700; word-break:keep-all; }
  .row .s { font-size:14px; font-weight:500; color:var(--muted-foreground); margin-top:2px;
            display:block; }
  .row .go { flex:0 0 auto; display:flex; align-items:center; gap:5px; font-size:14px;
             font-weight:600; color:var(--primary); }
  .row .go svg { width:14px; height:14px; }

  .bx { display:flex; align-items:center; gap:12px; }
  .bx.gray { background:color-mix(in srgb, var(--secondary) 60%, transparent);
             border-radius:8px; padding:15px 16px; }
  .bx.acc  { background:var(--accent); border-radius:16px; padding:17px 16px; }

  .btnP { height:52px; border-radius:8px; border:0; background:var(--primary);
          color:var(--primary-foreground); font-size:15.5px; font-weight:700;
          display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .acts { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .tab { font-variant-numeric:tabular-nums; }
  .mut { color:var(--muted-foreground); }
</style>

<script>
  const NAME = '카페 아메리카노 T 2잔 + 딸기 생크림 케이크';
  const X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
  const LINK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>`;
  const NOTE1 = '받으신 문자나 발행처 앱에서 연장할 수 있어요. 보통 90일씩, 최대 5년까지요.';
  const NOTE2 = '앱 안의 날짜만 바뀌어요. 실제 기프티콘은 발행처 기준입니다.';

  const KAKAO = `
    <div class="rows"><div class="row">
      <span style="flex:1;min-width:0">
        <span class="t">카카오톡 선물하기 상품인가요?</span>
        <span class="s">선물함에서 바로 연장할 수 있어요</span>
      </span>
      <span class="go">열기 ${LINK}</span>
    </div></div>`;

  // D-day 를 어디에 어떻게 두나
  const DD = {
    '가': ['지금 — 글자, 오른쪽 끝',
      '빨강 글자만 13px. 회색 부제 줄 끝에 붙어서 눈이 제목 → 본문으로 지나가는 길에 안 걸린다. 카드가 이미 겪고 뱃지로 뺀 자리다.',
      `<p class="desc"><span class="nm">${NAME}</span><span class="ddText">D-2</span></p>`],
    '나': ['알약, 이름 앞',
      '카드의 뱃지와 같은 옷 — 채운 알약, 급하면 빨강. 이름보다 먼저 오므로 급한 정도를 먼저 읽는다. 이름이 길어 잘려도 D-day 는 안 잘린다.',
      `<p class="desc"><span class="dd">D-2</span><span class="nm">${NAME}</span></p>`],
    '다': ['알약, 오른쪽 끝',
      '같은 알약이되 자리는 그대로 오른쪽. 이름을 먼저 읽고 급한 정도가 뒤따른다. 채워진 알약이라 글자보다는 훨씬 걸린다.',
      `<p class="desc"><span class="nm">${NAME}</span><span class="sp"></span><span class="dd">D-2</span></p>`],
  };

  // 2/2 의 날짜 블럭 — 어떤 옷으로 남기나
  const BLK = {
    '회색': ['회색 · 반지름 8',
      '시트의 다른 묶음 상자와 같은 옷. 화면 안에 반지름이 8 하나로 통일된다.',
      `<div class="bx gray">
        <span style="display:flex;flex-direction:column;gap:3px">
          <span class="mut" style="font-size:12px;font-weight:600">지금</span>
          <span class="mut tab" style="font-size:15px;font-weight:600;text-decoration:line-through">2026.09.10</span>
        </span>
        <span style="flex:1;text-align:center;font-size:16px" class="mut">→</span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <span style="font-size:12px;font-weight:700;color:var(--primary)">변경 후</span>
          <span class="tab" style="font-size:20px;font-weight:700;letter-spacing:-.025em">2026.12.09</span>
        </span></div>`],
    '연보라': ['연보라 · 반지름 16 — 지금',
      '지금 쓰는 옷. 「변경 후」가 더 도드라지지만, 시트에서 이 상자만 반지름이 16 이고 색도 혼자 다르다.',
      `<div class="bx acc">
        <span style="display:flex;flex-direction:column;gap:3px">
          <span class="mut" style="font-size:12px;font-weight:600">지금</span>
          <span class="mut tab" style="font-size:15px;font-weight:600;text-decoration:line-through">2026.09.10</span>
        </span>
        <span style="flex:1;text-align:center;font-size:16px;
          color:color-mix(in srgb, var(--primary) 40%, transparent)">→</span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          <span style="font-size:12px;font-weight:700;color:var(--primary)">변경 후</span>
          <span class="tab" style="font-size:20px;font-weight:700;letter-spacing:-.025em">2026.12.09</span>
        </span></div>`],
  };

  const sheet1 = (dd) => `
    <div class="sheet">
      <div class="hd">
        <div class="steps"><i class="on"></i><i></i><b>1 / 2</b></div>
        <p class="ttl">기한을 늘리시려면</p>
        ${dd}
        <span class="x">${X}</span>
      </div>
      <div class="bd"><p class="body">${NOTE1}</p>${KAKAO}
        <div class="acts"><button class="btnP">연장했어요</button></div></div>
    </div>`;

  const sheet2 = (blk) => `
    <div class="sheet">
      <div class="hd">
        <div class="steps"><i></i><i class="on"></i><b>2 / 2</b></div>
        <p class="ttl">늘어난 기한을<br>앱에도 반영할게요</p>
        <p class="desc"><span class="nm">${NAME}</span></p>
        <span class="x">${X}</span>
      </div>
      <div class="bd">${blk}
        <p class="body" style="font-size:12px">${NOTE2}</p>
        <div class="acts"><button class="btnP">2026.12.09까지로 바꾸기</button></div></div>
    </div>`;

  addEventListener('DOMContentLoaded', () => {
    const page = document.querySelector('.page');
    Object.entries(DD).forEach(([k, [name, note, dd]]) => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<p class="cap">${k} · ${name}</p><p class="sub">${note}</p>` + sheet1(dd);
      page.appendChild(col);
    });
    // 2/2 는 블럭 옷만 견준다
    const wrap = document.createElement('div');
    wrap.style.cssText = 'width:100%;flex:0 0 100%';
    wrap.innerHTML = `<hr class="hr"><p class="h2">2 / 2 — 블럭은 남기고 옷만 견준다</p>`;
    page.appendChild(wrap);
    Object.entries(BLK).forEach(([k, [name, note, blk]]) => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<p class="cap">${name}</p><p class="sub">${note}</p>` + sheet2(blk);
      page.appendChild(col);
    });
  });
</script>

<div class="page"></div>
