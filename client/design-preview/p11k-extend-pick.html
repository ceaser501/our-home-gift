<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>기한 연장 2/2 — 날짜 고르기</title>
<script type="module" src="/src/index.css"></script>
<style>
  body { margin:0; background:#3a3a44; font-family:Pretendard, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; color:#fff; }
  .page { display:flex; gap:20px; align-items:flex-start; justify-content:center;
          padding:16px 14px 80px; flex-wrap:wrap; }
  .col { width:375px; flex:0 0 auto; }
  .cap { font-size:13px; font-weight:800; margin:0 0 3px; }
  .sub { color:#b8b8c4; font-size:11px; line-height:1.5; margin:0 0 8px; min-height:78px; }
  .st  { color:#9d9daa; font-size:10px; font-weight:700; margin:12px 0 4px; }

  .sheet { background:var(--background); color:var(--foreground);
           border-radius:16px 16px 0 0; overflow:hidden; box-shadow:0 -2px 24px rgba(0,0,0,.28); }
  .hd  { display:flex; flex-direction:column; gap:5px; padding:20px 60px 16px 20px; position:relative; }
  .ttl { font-size:20px; line-height:1.2; font-weight:700; letter-spacing:-.025em; margin:0;
         word-break:keep-all; }
  .x   { position:absolute; top:10px; right:10px; width:44px; height:44px; display:flex;
         align-items:center; justify-content:center; color:var(--muted-foreground); }
  .x svg { width:24px; height:24px; }
  .back { margin:-10px 4px -10px -10px; padding:10px; display:flex; flex:0 0 auto;
          color:var(--muted-foreground); }
  .back svg { width:20px; height:20px; }
  .bd  { padding:0 20px 20px; display:flex; flex-direction:column; gap:14px; }
  .steps { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .steps i { display:block; height:4px; width:22px; border-radius:99px; background:var(--input); }
  .steps i.on { background:var(--primary); }
  .steps b { font-size:12px; font-weight:700; color:var(--muted-foreground);
             font-variant-numeric:tabular-nums; margin-left:4px; }
  .body { margin:0; font-size:12px; line-height:1.6; font-weight:500;
          color:var(--muted-foreground); word-break:keep-all; }

  .box { background:color-mix(in srgb, var(--secondary) 60%, transparent);
         border-radius:8px; padding:15px 16px; display:flex; flex-direction:column; gap:2px; }
  .nm  { margin:0 0 7px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
         font-size:15px; font-weight:700; }
  .old { color:var(--muted-foreground); text-decoration:line-through; font-size:14px;
         font-weight:600; font-variant-numeric:tabular-nums; }
  .newrow { display:flex; align-items:center; gap:8px; }
  .new { font-size:22px; font-weight:700; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .new.tap { text-decoration:underline; text-decoration-color:var(--muted-foreground);
             text-underline-offset:5px; text-decoration-thickness:1.5px; }
  .cal { display:flex; align-items:center; justify-content:center; width:34px; height:34px;
         border-radius:8px; background:var(--card); border:1px solid var(--input);
         color:var(--foreground); flex:0 0 auto; }
  .cal svg { width:17px; height:17px; }
  .pick { font-size:13px; font-weight:600; color:var(--primary); flex:0 0 auto; }
  .btnP { height:52px; border-radius:8px; border:0; background:var(--primary);
          color:var(--primary-foreground); font-size:15.5px; font-weight:700;
          display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .btnS { height:52px; border-radius:8px; border:1px solid var(--input); background:var(--card);
          font-size:15.5px; font-weight:600; font-family:inherit;
          color:color-mix(in srgb, var(--foreground) 80%, transparent); }
  .acts { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  /* 고르는 중 — 네이티브 날짜 입력이 그 자리에 들어온다 */
  .dateInput { height:48px; width:100%; border-radius:8px; border:1.5px solid var(--primary);
               background:var(--card); padding:0 14px; font-family:inherit; font-size:17px;
               font-weight:700; color:var(--foreground); font-variant-numeric:tabular-nums; }
  .mut { color:var(--muted-foreground); }
</style>

<script>
  const NAME = '카페 아메리카노 T 2잔 + 딸기 생크림 케이크';
  const X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
  const BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`;
  const CAL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18"/><rect
    x="3" y="4" width="18" height="18" rx="2"/></svg>`;
  const NOTE = '앱 안의 날짜만 바뀌어요. 실제 기프티콘은 발행처 기준입니다.';

  const V = {
    '가': ['새 날짜를 눌러서 고른다',
      '바꿀 값을 바로 누른다. 밑줄이 「이건 고칠 수 있다」를 말하고, 옆의 달력이 무엇으로 고치는지를 말한다. 버튼이 하나도 안 는다.',
      `<div class="newrow"><span class="new tap">2026.12.09</span>
        <span class="cal">${CAL}</span></div>`,
      ''],
    '나': ['옆에 「직접 고르기」',
      '글자로 적어 무엇을 하는지 분명하다. 다만 새 날짜(22px) 옆에 13px 링크가 붙어 크기 차이가 크고, 누를 자리가 좁다.',
      `<div class="newrow"><span class="new">2026.12.09</span>
        <span class="pick">직접 고르기</span></div>`,
      ''],
    '다': ['보조 버튼으로 — 원래 방식',
      '블럭은 보여주기만 하고 고치는 것은 아래 버튼이 맡는다. 제일 뚜렷하지만 채워진 네모가 둘이 된다 — 「블럭이 많다」던 자리로 되돌아간다.',
      `<div class="newrow"><span class="new">2026.12.09</span></div>`,
      '<button class="btnS">직접 날짜 선택</button>'],
  };

  const sheet = (newrow, extra, picking) => `
    <div class="sheet">
      <div class="hd">
        <div class="steps"><span class="back">${BACK}</span><i></i><i class="on"></i><b>2 / 2</b></div>
        <p class="ttl">늘어난 기한을<br>앱에도 반영할게요</p><span class="x">${X}</span>
      </div>
      <div class="bd">
        <div class="box">
          <p class="nm">${NAME}</p>
          <span class="old">2026.09.10</span>
          ${picking
            ? `<input class="dateInput" type="date" value="2026-12-24" style="margin-top:5px" />`
            : newrow}
        </div>
        <p class="body">${NOTE}</p>
        <div class="acts">
          <button class="btnP">${picking ? '2026.12.24까지로 바꾸기' : '2026.12.09까지로 바꾸기'}</button>
          ${picking ? '' : extra}
        </div>
      </div>
    </div>`;

  addEventListener('DOMContentLoaded', () => {
    const page = document.querySelector('.page');
    Object.entries(V).forEach(([k, [name, note, newrow, extra]]) => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<p class="cap">${k} · ${name}</p><p class="sub">${note}</p>`
        + `<p class="st">평소 — 90일이 미리 계산돼 있다</p><div id="a${k}">${sheet(newrow, extra, false)}</div>`
        + `<p class="st">고르는 중 — 그 자리에 날짜 입력이 들어온다</p><div id="b${k}">${sheet(newrow, extra, true)}</div>`
        + `<p class="st" id="n${k}"></p>`;
      page.appendChild(col);
    });
    const measure = () => Object.keys(V).forEach((k) => {
      const a = document.querySelector('#a' + k + ' .sheet').getBoundingClientRect().height;
      const b = document.querySelector('#b' + k + ' .sheet').getBoundingClientRect().height;
      document.getElementById('n' + k).textContent = `평소 ${Math.round(a)}px · 고르는 중 ${Math.round(b)}px`;
    });
    new ResizeObserver(measure).observe(document.body);
    document.fonts.ready.then(() => requestAnimationFrame(measure));
    setTimeout(measure, 500); setTimeout(measure, 1400);
  });
</script>

<div class="page"></div>
