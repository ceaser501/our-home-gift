<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>금액 입력 — 굴러가는 곡선</title>
<script type="module" src="/src/index.css"></script>
<style>
  body { margin:0; background:#3a3a44; font-family:Pretendard, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; color:#fff; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:15px; font-weight:800; margin:0 0 4px; }
  .lead { color:#b8b8c4; font-size:12px; line-height:1.6; margin:0 0 16px; }
  .go { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 20px; }
  .go button { height:40px; padding:0 16px; border-radius:10px; border:0; cursor:pointer;
               background:#5b4fe8; color:#fff; font-size:13px; font-weight:700;
               font-family:inherit; }
  .go button.alt { background:#4a4a55; }

  .row { background:var(--background); color:var(--foreground); border-radius:12px;
         padding:14px 16px; margin:0 0 10px; }
  .row h2 { font-size:12px; font-weight:800; margin:0 0 2px; }
  .row p  { font-size:11px; line-height:1.5; color:var(--muted-foreground); margin:0 0 10px; }
  .bal { margin:0 0 7px; display:flex; align-items:baseline; gap:4px; }
  .bal .n { font-size:16px; font-weight:700; letter-spacing:-.025em;
            font-variant-numeric:tabular-nums; }
  .bal .s { font-size:14px; font-weight:600; }
  .track { position:relative; height:6px; border-radius:99px; overflow:hidden;
           background:color-mix(in srgb, var(--primary) 75%, var(--background)); }
  .now   { position:absolute; top:0; bottom:0; right:0;
           background:color-mix(in srgb, var(--primary) 26%, var(--background)); }
  .used  { position:absolute; top:0; bottom:0; right:0; left:76%; background:var(--secondary); }
  .plot  { margin-top:9px; height:52px; width:100%; display:block; }
</style>

<div class="wrap">
  <h1>굴러가는 곡선 — 셋을 한 번에</h1>
  <p class="lead">
    아래 버튼을 누르면 셋이 같은 순간에 같은 거리를 굴러간다. 시간(560ms)도 같다.
    다른 것은 곡선뿐이다. 오른쪽 그림은 시간이 가는 동안 거리가 어떻게 가는지다.
  </p>
  <div class="go">
    <button data-to="0">전액 — 380,000 에서 0 으로</button>
    <button class="alt" data-to="349000">31,000원 — 조금만</button>
    <button class="alt" data-to="380000">되돌리기</button>
  </div>
  <div id="rows"></div>
</div>

<script>
  const FACE = 500000, LEFT = 380000, MS = 560;
  const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';

  const E = {
    linear: ['균일 (linear)', '처음부터 끝까지 같은 속도. 기계 계수기에 가깝다. 딱 멈추는 것이 눈에 걸린다.',
      (p) => p],
    out: ['감속 (ease-out) — 지금', '시작이 제일 빠르고 끝에서 잦아든다. 눌렀다는 느낌이 바로 오고 착지가 부드럽다.',
      (p) => 1 - (1 - p) ** 2],
    inout: ['가감속 (ease-in-out)', '천천히 떠서 가운데가 빠르고 다시 잦아든다. 큰 덩어리가 움직일 때 쓰는 곡선이라 숫자에는 늦게 뜨는 느낌이 든다.',
      (p) => (p < 0.5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2)],
  };

  const rows = document.getElementById('rows');
  const state = {};

  Object.entries(E).forEach(([k, [name, note, fn]]) => {
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = `<h2>${name}</h2><p>${note}</p>
      <div style="display:flex;gap:16px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <p class="bal"><span class="n" id="n-${k}">${won(LEFT)}</span><span class="s">남음</span></p>
          <div class="track"><div class="now" id="b-${k}" style="left:76%"></div><div class="used"></div></div>
        </div>
        <svg class="plot" viewBox="0 0 100 52" style="flex:0 0 120px" id="p-${k}"></svg>
      </div>`;
    rows.appendChild(el);
    state[k] = { fn, cur: LEFT };

    // 곡선 그림 — 가로가 시간, 세로가 간 거리
    const path = Array.from({ length: 41 }, (_, i) => {
      const p = i / 40;
      return `${p * 100},${48 - fn(p) * 44}`;
    }).join(' ');
    document.getElementById('p-' + k).innerHTML =
      `<polyline points="0,48 100,4" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 2"/>
       <polyline points="${path}" fill="none" stroke="var(--primary)" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"/>`;
  });

  document.querySelectorAll('.go button').forEach((b) => {
    b.onclick = () => {
      const to = Number(b.dataset.to);
      const t0 = performance.now();
      Object.entries(state).forEach(([k, st]) => {
        const from = st.cur;
        const num = document.getElementById('n-' + k);
        const bar = document.getElementById('b-' + k);
        const tick = (now) => {
          const p = Math.min(1, (now - t0) / MS);
          const v = from + (to - from) * st.fn(p);
          st.cur = v;
          num.textContent = won(v);
          bar.style.left = `${(v / FACE) * 100}%`;
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    };
  });
</script>
