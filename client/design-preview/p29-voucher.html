<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>금액권 줄</title>
<style>
  :root {
    --foreground: #1c1e27; --muted-foreground: #545461; --card: #fbfbfd;
    --border: #e7e7ec; --input: #e7e7ec; --secondary: #f1f1f5; --primary: #5b4fe8;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #8a8a90; padding: 16px 0 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  h3 { color: #fff; font-size: 13px; font-weight: 800; padding: 0 20px 3px; }
  p.why { color: #e4e4ea; font-size: 12px; line-height: 1.5; padding: 0 20px 10px; }
  section { margin-bottom: 22px; }
  .sheet { background: var(--card); border-radius: 20px; margin: 0 8px; padding: 20px;
           display: flex; flex-direction: column; gap: 20px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  label { font-size: 14px; font-weight: 600; line-height: 1; color: rgba(28,30,39,.7); }
  .f { height: 52px; border: 1px solid var(--input); border-radius: 14px; background: var(--card);
       display: flex; align-items: center; padding: 0 16px; font-size: 16px; color: var(--foreground); }
  .f .won { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--muted-foreground); }
  .f .ar { margin-left: auto; opacity: .45; }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500; }
  .chk i { width: 18px; height: 18px; border-radius: 4px; background: var(--primary); flex: none;
           display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; }
</style>
<div id="out"></div>
<script>
  var AR = '<svg class="ar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
  var V = [
    { t: '가 · 지금 — 테두리 상자 (모서리 16)', box: 'border', r: 16, h: 52, gap: 20 },
    { t: '나 · 테두리 없이, 금액에 붙여서', box: 'none', r: 0, h: 44, gap: 12 },
    { t: '다 · 테두리 없이, 사이는 그대로', box: 'none', r: 0, h: 44, gap: 20 }
  ];
  var pick = new URLSearchParams(location.search).get('v');
  var LIST = pick ? [V[{ now:0, tight:1, plain:2 }[pick] || 0]] : V;

  out.innerHTML = LIST.map(function (v) {
    var chkS = v.box === 'border'
      ? 'border:1px solid var(--input);background:var(--card);border-radius:' + v.r + 'px;padding:0 16px;height:' + v.h + 'px;'
      : 'padding:0 2px;height:' + v.h + 'px;';
    return '<section><h3>' + v.t + '</h3><p class="why">' +
      (v.box === 'border'
        ? '아홉 번째 칸처럼 보인다. 모서리도 칸(14)과 달리 16 이다.'
        : (v.gap === 12
           ? '금액에 딸린 설정이라 금액 쪽으로 붙인다. 아래 칸과는 20 으로 벌린다.'
           : '테두리만 걷고 사이는 20 그대로.')) +
      '</p><div class="sheet">' +
      '<div class="two">' +
        '<div class="grp"><label>바코드 번호</label><div class="f">88012345678901</div></div>' +
        '<div class="grp"><label>금액</label><div class="f">500,000<span class="won">원</span></div></div>' +
      '</div>' +
      '<div class="chk" style="margin-top:' + (v.gap - 20) + 'px;' + chkS + '"><i>✓</i>금액권 — 쓴 만큼 깎여요</div>' +
      '<div class="two">' +
        '<div class="grp"><label>사용기한</label><div class="f">2026. 09. 03.' + AR + '</div></div>' +
        '<div class="grp"><label>받는 사람</label><div class="f">태수' + AR + '</div></div>' +
      '</div>' +
      '</div></section>';
  }).join('');
</script>
