<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>기한 연장 2/2 — 날짜 블럭</title>
<script type="module" src="/src/index.css"></script>
<style>
  body { margin:0; background:#3a3a44; font-family:Pretendard, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; color:#fff; }
  .page { display:flex; gap:20px; align-items:flex-start; justify-content:center;
          padding:16px 14px 80px; flex-wrap:wrap; }
  .col { width:375px; flex:0 0 auto; }
  .cap { font-size:13px; font-weight:800; margin:0 0 3px; }
  .sub { color:#b8b8c4; font-size:11px; line-height:1.5; margin:0 0 8px; min-height:74px; }
  .st  { color:#9d9daa; font-size:10px; font-weight:700; margin:8px 0 0; }

  .sheet { background:var(--background); color:var(--foreground);
           border-radius:16px 16px 0 0; overflow:hidden; box-shadow:0 -2px 24px rgba(0,0,0,.28); }
  .hd  { display:flex; flex-direction:column; gap:5px; padding:20px 60px 16px 20px; position:relative; }
  .ttl { font-size:20px; line-height:1.2; font-weight:700; letter-spacing:-.025em; margin:0;
         word-break:keep-all; }
  .x   { position:absolute; top:10px; right:10px; width:44px; height:44px; display:flex;
         align-items:center; justify-content:center; color:var(--muted-foreground); }
  .x svg { width:24px; height:24px; }
  .back { margin:-10px 4px -10px -10px; padding:10px; display:flex; flex:0 0 auto;
          color:var(--muted-foreground); }
  .back svg { width:20px; height:20px; }
  .bd  { padding:0 20px 20px; display:flex; flex-direction:column; gap:14px; }
  .steps { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .steps i { display:block; height:4px; width:22px; border-radius:99px; background:var(--input); }
  .steps i.on { background:var(--primary); }
  .steps b { font-size:12px; font-weight:700; color:var(--muted-foreground);
             font-variant-numeric:tabular-nums; margin-left:4px; }
  .body { margin:0; font-size:12px; line-height:1.6; font-weight:500;
          color:var(--muted-foreground); word-break:keep-all; }

  .box { background:color-mix(in srgb, var(--secondary) 60%, transparent);
         border-radius:8px; padding:15px 16px; display:flex; flex-direction:column; }
  .nm  { margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
         font-size:15px; font-weight:700; }
  .old { color:var(--muted-foreground); text-decoration:line-through;
         font-variant-numeric:tabular-nums; }
  .new { font-weight:700; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .btnP { height:52px; border-radius:8px; border:0; background:var(--primary);
          color:var(--primary-foreground); font-size:15.5px; font-weight:700;
          display:flex; align-items:center; justify-content:center; font-family:inherit;
          margin-top:8px; }
  .mut { color:var(--muted-foreground); }
</style>

<script>
  const NAME = '카페 아메리카노 T 2잔 + 딸기 생크림 케이크';
  const X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
  const BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`;
  const NOTE = '앱 안의 날짜만 바뀌어요. 실제 기프티콘은 발행처 기준입니다.';

  const V = {
    '가': ['지금 시안 — 선 · 라펠 · 화살표',
      '「바뀐다」를 세 가지로 세 번 말한다 — 취소선, 화살표, 그리고 「지금 / 변경 후」 라벨. 거기에 상자를 가로지르는 실선까지 있어 영수증처럼 보인다.',
      `<div class="box" style="gap:12px">
         <p class="nm">${NAME}</p>
         <div style="height:1px;background:var(--border);margin:0 -16px"></div>
         <div style="display:flex;align-items:center;gap:12px">
           <span style="display:flex;flex-direction:column;gap:3px">
             <span class="mut" style="font-size:12px;font-weight:600">지금</span>
             <span class="old" style="font-size:15px;font-weight:600">2026.09.10</span></span>
           <span style="flex:1;text-align:center;font-size:16px" class="mut">→</span>
           <span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
             <span style="font-size:12px;font-weight:700;color:var(--primary)">변경 후</span>
             <span class="new" style="font-size:20px">2026.12.09</span></span>
         </div></div>`],

    '나': ['라벨과 선을 걷고 한 줄로',
      '취소선 하나면 어느 쪽이 옛 날짜인지 말이 된다. 라벨 둘과 실선을 걷고 두 날짜를 나란히 붙인다 — 떨어져 있으면 화살표가 다리를 놓아야 하지만, 붙어 있으면 그 자체로 읽힌다.',
      `<div class="box" style="gap:9px">
         <p class="nm">${NAME}</p>
         <p style="margin:0;display:flex;align-items:baseline;gap:9px">
           <span class="old" style="font-size:15px;font-weight:600">2026.09.10</span>
           <span class="mut" style="font-size:14px">→</span>
           <span class="new" style="font-size:20px">2026.12.09</span>
         </p></div>`],

    '다': ['위아래로 — 화살표도 걷고',
      '옛 날짜 아래에 새 날짜를 둔다. 아래로 내려가는 것 자체가 「이렇게 바뀐다」이므로 화살표가 필요 없다. 새 날짜가 줄을 통째로 가져서 제일 크게 선다.',
      `<div class="box" style="gap:2px">
         <p class="nm" style="margin-bottom:7px">${NAME}</p>
         <span class="old" style="font-size:14px;font-weight:600">2026.09.10</span>
         <span class="new" style="font-size:22px">2026.12.09<span
           style="font-size:15px;font-weight:600" class="mut"> 까지</span></span>
       </div>`],
  };

  addEventListener('DOMContentLoaded', () => {
    const page = document.querySelector('.page');
    Object.entries(V).forEach(([k, [name, note, box]]) => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<p class="cap">${k} · ${name}</p><p class="sub">${note}</p>`
        + `<div class="sheet" id="s${k}">
             <div class="hd">
               <div class="steps"><span class="back">${BACK}</span><i></i><i class="on"></i><b>2 / 2</b></div>
               <p class="ttl">늘어난 기한을<br>앱에도 반영할게요</p><span class="x">${X}</span>
             </div>
             <div class="bd">${box}<p class="body">${NOTE}</p>
               <button class="btnP">2026.12.09까지로 바꾸기</button></div>
           </div>`
        + `<p class="st" id="n${k}"></p>`;
      page.appendChild(col);
    });
    const measure = () => Object.keys(V).forEach((k) => {
      const el = document.getElementById('s' + k);
      document.getElementById('n' + k).textContent =
        `시트 ${Math.round(el.getBoundingClientRect().height)}px · 블럭 안 요소 ${el.querySelectorAll('.box *').length}개`;
    });
    new ResizeObserver(measure).observe(document.body);
    document.fonts.ready.then(() => requestAnimationFrame(measure));
    setTimeout(measure, 500); setTimeout(measure, 1400);
  });
</script>

<div class="page"></div>
