<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>금액 입력 — 버튼 앞 간격</title>
<script type="module" src="/src/index.css"></script>
<style>
  body { margin:0; background:#3a3a44; font-family:Pretendard, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; }
  .page { display:flex; gap:20px; align-items:flex-start; justify-content:center;
          padding:16px 14px 80px; flex-wrap:wrap; }
  .col { width:375px; flex:0 0 auto; }
  .cap { color:#fff; font-size:13px; font-weight:800; margin:0 0 3px; }
  .sub { color:#b8b8c4; font-size:11px; line-height:1.5; margin:0 0 8px; min-height:48px; }
  .num { color:#9d9daa; font-size:10px; font-weight:700; margin:6px 0 0; font-variant-numeric:tabular-nums; }

  .sheet { background:var(--background); border-radius:16px 16px 0 0; overflow:hidden;
           box-shadow:0 -2px 24px rgba(0,0,0,.28); color:var(--foreground); }
  .hd  { display:flex; flex-direction:column; gap:4px; padding:20px 60px 20px 20px; position:relative; }
  .ttl { font-size:20px; line-height:1.2; font-weight:700; letter-spacing:-.025em; margin:0; }
  .x   { position:absolute; top:10px; right:10px; width:44px; height:44px; display:flex;
         align-items:center; justify-content:center; color:var(--muted-foreground); }
  .x svg { width:24px; height:24px; }
  .desc { margin:0; font-size:14px; line-height:1.5; font-weight:500; color:var(--muted-foreground);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 본문은 덩어리 셋이다 — 잔액 / 입력(칩까지) / 버튼.
     칩은 입력의 부속이라 8, 덩어리 사이는 16, 버튼 앞은 갈래마다 다르게 본다. */
  .bd    { padding:0 20px 20px; display:flex; flex-direction:column; gap:16px; }
  .group { display:flex; flex-direction:column; gap:8px; }

  .track { position:relative; height:6px; border-radius:99px; overflow:hidden;
           background:color-mix(in srgb, var(--primary) 75%, var(--background)); }
  .rest  { position:absolute; top:0; bottom:0; right:0; left:76%; background:var(--secondary); }
  .box  { display:flex; height:56px; align-items:center; gap:10px; border-radius:8px;
          border:1.5px solid var(--primary); background:var(--card); padding:0 15px; }
  .box .v { flex:1; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .box .w { font-size:16px; font-weight:600; color:var(--muted-foreground); }
  .clr { width:22px; height:22px; flex:0 0 auto; border:0; padding:0; border-radius:99px;
         background:var(--border); color:var(--muted-foreground); display:flex;
         align-items:center; justify-content:center; }
  .clr svg { width:12px; height:12px; }
  .chips { display:flex; gap:8px; }
  /* 늘리지 않고 글자 너비로 둔다. 넷이 폭을 꽉 채우면 자판처럼 보인다. */
  .chips button { height:36px; padding:0 16px; border-radius:12px; border:0;
                  background:var(--secondary); font-size:14px; font-weight:600;
                  color:var(--foreground); font-family:inherit; font-variant-numeric:tabular-nums; }
  .btnP { height:52px; border-radius:8px; border:0; background:var(--primary);
          color:var(--primary-foreground); font-size:15.5px; font-weight:700;
          display:flex; align-items:center; justify-content:center; font-family:inherit; }
  .tab { font-variant-numeric:tabular-nums; }
  .mut { color:var(--muted-foreground); }
</style>

<script>
  const XSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;

  // 입력은 20 으로 고정한다. 이제 잔액만 내리며 견준다.
  // 잔액이 안 보이던 것은 막대가 받아갔으니, 숫자는 근거의 크기로 물러나도 된다.
  const V = {
    '가': [20, '지금 — 입력과 같은 20. 근거와 답이 같은 무게라 안 갈린다.'],
    '나': [18, '한 단 아래. 다만 18 은 스케일에 없는 값이다 — text-lg 를 쓰거나 토큰을 새로 세워야 한다.'],
    '다': [16, '스케일에서 20 바로 아래(callout·subtitle). 새 값을 안 들이고 한 단 내려간다.'],
  };

  const sheet = (bal) => `
    <div class="sheet">
      <div class="hd">
        <p class="ttl">얼마 쓰셨어요?</p>
        <p class="desc">카페 아메리카노 T 2잔 + 딸기 생크림 케이크</p>
        <span class="x">${XSVG}</span>
      </div>
      <div class="bd">
        <div class="group" style="gap:7px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
            <span class="tab" style="font-size:${bal}px;line-height:1.2;font-weight:700;letter-spacing:-.025em">
              380,000원 <span style="font-size:${bal <= 16 ? 13 : 14}px;font-weight:600">남음</span></span>
            <span class="mut tab" style="font-size:12px;font-weight:500">50만원권</span>
          </div>
          <div class="track"><div class="rest"></div></div>
        </div>

        <div class="group">
          <div class="box"><span class="v">120,000</span>
            <button class="clr">${XSVG}</button><span class="w">원</span></div>
          <div class="chips">
            <button>전액</button><button>+1만</button><button>+5천</button><button>+1천</button>
          </div>
        </div>

        <button class="btnP" style="margin-top:8px">120,000원 쓰고 260,000원 남기기</button>
      </div>
    </div>`;

  addEventListener('DOMContentLoaded', () => {
    const page = document.querySelector('.page');
    Object.entries(V).forEach(([k, [gap, note]]) => {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `<p class="cap">${k} · 잔액 ${gap}px</p><p class="sub">${note}</p>`
        + sheet(gap) + `<p class="num" id="n${k}"></p>`;
      page.appendChild(col);
    });
    const measure = () => Object.keys(V).forEach((k, i) => {
      const el = document.querySelectorAll('.sheet')[i];
      document.getElementById('n' + k).textContent =
        `시트 ${Math.round(el.getBoundingClientRect().height)}px`;
    });
    new ResizeObserver(measure).observe(document.body);
    document.fonts.ready.then(() => requestAnimationFrame(measure));
    setTimeout(measure, 500); setTimeout(measure, 1400);
  });
</script>

<div class="page"></div>
